# Research Front Definitions for Perovskite Solar Cells
# Each front includes:
#   - canonical: Primary terms that define the front
#   - aliases: Common synonyms and variations
#   - regex_patterns: Patterns for flexible matching
#   - description: Brief description for human reviewers
#   - anchor_dois: Landmark papers that define this front

