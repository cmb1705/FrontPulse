[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "frontpulse"
version = "0.1.0"
description = "Research front monitoring pipeline for academic literature"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "FrontPulse Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "networkx==3.4.2",
    "tqdm==4.67.1",
    "psutil==6.1.1",
    "memory_profiler==0.61.0",
    "python-igraph==0.11.8",
    "leidenalg==0.10.2",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "ruff==0.8.4",
    "isort==5.13.2",
    "mypy==1.13.0",
    "pandas-stubs==2.2.3.241126",
    "pydantic==2.10.3",
    "pytest-xdist==3.6.1",
    "pytest-mock==3.14.0",
    "pytest-timeout==2.3.1",
    "sphinx==8.1.3",
    "sphinx-rtd-theme==3.0.2",
]

[project.urls]
Homepage = "https://github.com/cmb1705/FrontPulse"
Repository = "https://github.com/cmb1705/FrontPulse"
Issues = "https://github.com/cmb1705/FrontPulse/issues"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/data/*", "*/.venv/*", "*/build/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "data",
    "scripts/migrate_data_out_structure.py",  # Incomplete legacy script (broken docstring)
]

[tool.ruff.lint]
# Enable pycodestyle (E/W), Pyflakes (F), isort (I), and pydocstyle (D)
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "E741",  # ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["ARG", "SIM"]  # Less strict for tests
# Legacy baseline (2026-03-28): suppress pre-existing violations to enable
# enforcement on new code. Remove entries as legacy files are cleaned up.
"src/*.py" = ["E701", "E702", "B904", "ARG"]  # Compact multi-statement, raise-from, interface args
"scripts/*.py" = ["E402", "E702", "E722", "ARG", "B007", "B018", "SIM102", "SIM115"]  # Bootstrap E402, legacy style

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "networkx.*",
    "igraph.*",
    "leidenalg.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for individual functions/classes",
    "integration: Integration tests for module interactions",
    "slow: Tests that take significant time to run",
    "requires_api: Tests that require external API access",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
